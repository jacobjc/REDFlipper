<!DOCTYPE html>
<html>
<head>
  <script defer src="./index.js"></script>
  <style>
    body { color: var(--uxp-host-text-color, #ddd); font-size: 12px; padding: 10px 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
    button { padding: 4px 10px; }
    #status { color: var(--uxp-host-text-color-secondary, #aaa); min-height: 16px; margin: 4px 0 4px; }
    #progressWrap { height: 4px; background: #3a3a3a; border-radius: 2px; overflow: hidden; margin: 0 0 8px; }
    #progressBar { height: 4px; width: 0%; background: #2d8ceb; }
    .hidden { display: none; }
    #version { font-size: 10px; font-weight: normal; color: #777; margin-left: 6px; }
    #log { border: 1px solid #555; border-radius: 4px; padding: 6px 8px; height: 300px; overflow-y: scroll;
           font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap; }
    .err { color: #ff8080; } .ok { color: #8fdc8f; } .warn { color: #f0c060; } .dim { color: #999; }
  </style>
</head>
<body>
  <h1>REDFlipper<span id="version"></span></h1>
  <div class="row">
    <label><input type="checkbox" id="selectedOnly" checked> Selected clips only (untick for the whole sequence)</label>
  </div>
  <div class="row">
    <button id="flip">Analyze &amp; Flip</button>
    <button id="preview">Preview</button>
    <button id="remove">Remove rotation</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <div id="status"></div>
  <div id="progressWrap" class="hidden"><div id="progressBar"></div></div>
  <div id="log"></div>
</body>
</html>
